name: Main

on:
  push:
    branches: [main]
  # Manual re-deploy, e.g. to recover after a failed run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# A newer commit on main supersedes an in-flight deploy of an older one.
concurrency:
  group: publish-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Supplies CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
    environment: cloudflare-main
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/publish-to-cloudflare-pages
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project-name: pcc-website
          # Must match the Pages project's production_branch (iac/deploy_site),
          # otherwise wrangler files the upload as a preview, not production.
          branch-name: main
